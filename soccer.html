    const hc = controllerOf(p);
    if (hc) {
      const mine = isLocal(hc);
      ctx.strokeStyle = mine ? "#ffd33d" : "rgba(255,255,255,0.88)";
      ctx.lineWidth = Math.max(1.4, 2.1 * S);
      ctx.beginPath();
      ctx.ellipse(foot.x, foot.y, 13 * S, 4.6 * S, 0, 0, Math.PI * 2);
      ctx.stroke();
      const ahead = w2s(p.x + (p.fx || 0) * 20, p.y + (p.fy || 0) * 20, 0);
      const dx = ahead.x - foot.x, dy = ahead.y - foot.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len, px = -uy, py = ux;
      ctx.fillStyle = mine ? "#ffd33d" : "rgba(255,255,255,0.88)";
      ctx.beginPath();
      ctx.moveTo(foot.x + ux * 16 * S, foot.y + uy * 16 * S);
      ctx.lineTo(foot.x + ux * 9 * S + px * 4.5 * S, foot.y + uy * 9 * S + py * 4.5 * S);
      ctx.lineTo(foot.x + ux * 9 * S - px * 4.5 * S, foot.y + uy * 9 * S - py * 4.5 * S);
      ctx.closePath();
      ctx.fill();
    }
  }
  if (p.skill === "spin") {
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(foot.x, foot.y - 4, 12 * S, viewTime * 14, viewTime * 14 + 4);
    ctx.stroke();
  }

  ctx.save();
  ctx.translate(foot.x, foot.y);
  const sideOn = clamp(Math.abs(p.fx || 1) * 1.25, 0.7, 1);
  ctx.scale(face * sideOn, 1);
  if (lying) ctx.rotate((p.fallDir > 0 ? 1 : -1) * (p.state === "down" ? 1.4 : 1.08));
  if (pose === "slide") ctx.translate(0, H * 0.1);
  if (pose === "spin" && game.celebration) {
    const a = (game.celebration.t * 5) % (Math.PI * 2);
    ctx.translate(0, -Math.abs(Math.sin(a / 2)) * H * 0.4 - H * 0.15);
    ctx.rotate(a);
    ctx.translate(0, H * 0.15);
  }
  if (!lying && speed > 22) ctx.rotate(run * 0.05);

  const hip = -H * 0.46;
  const sw = run * H * 0.2;
  const kneeY = hip + H * 0.24;
  const sock = kit.socks || "#222";
  const skin = p.skin || "#e0ac69";
  // Legs, back one first. A kick swings the front boot through.
  limb(-H * 0.07, hip, -H * 0.05 - sw * 0.45, kneeY, -H * 0.02 - sw, -H * 0.015, sock, H * 0.07);
  ctx.fillStyle = "#121212";
  ctx.beginPath();
  ctx.ellipse(-H * 0.02 - sw, -H * 0.01, H * 0.065, H * 0.03, 0, 0, Math.PI * 2);
  ctx.fill();

  const fs = -sw + kickAmp * H * 0.42;
  const kneeX = H * 0.06 + fs * (kickAmp > 0.15 ? 0.15 : 0.35);
  limb(H * 0.08, hip, kneeX, kickAmp > 0.2 ? hip + H * 0.16 : kneeY, H * 0.03 + fs, -H * 0.015, sock, H * 0.078);
  ctx.fillStyle = "#121212";
  ctx.beginPath();
  ctx.ellipse(H * 0.03 + fs, -H * 0.01, H * 0.07, H * 0.032, 0, 0, Math.PI * 2);
  ctx.fill();

  // Shorts and shirt.
  ctx.fillStyle = kit.shorts;
  roundRect(ctx, -H * 0.155, hip - H * 0.01, H * 0.31, H * 0.15, H * 0.04);
  ctx.fill();
  ctx.fillStyle = kit.shirt;
  roundRect(ctx, -H * 0.175, -H * 0.8, H * 0.35, H * 0.36, H * 0.08);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.28)";
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fillRect(-H * 0.175, -H * 0.62, H * 0.35, H * 0.035);

  // Arms.
  const as = -run * H * 0.16;
  const armW = H * 0.055;
  if (pose === "plane" || (p.role === "GK" && p.state === "dive")) {
    limb(-H * 0.16, -H * 0.7, -H * 0.46, -H * 0.64 + Math.sin(viewTime * 8) * H * 0.03, undefined, undefined, skin, armW);
    limb(H * 0.16, -H * 0.7, H * 0.46, -H * 0.64 - Math.sin(viewTime * 8) * H * 0.03, undefined, undefined, skin, armW);
  } else if (pose) {
    const w = Math.sin(viewTime * 10 + (p.num || 0)) * H * 0.03;
    limb(-H * 0.14, -H * 0.68, -H * 0.24, -H * 0.98 + w, undefined, undefined, skin, armW);
    limb(H * 0.14, -H * 0.68, H * 0.24, -H * 0.98 - w, undefined, undefined, skin, armW);
  } else {
    limb(-H * 0.16, -H * 0.68, -H * 0.26 + as, -H * 0.4, undefined, undefined, skin, armW);
    limb(H * 0.16, -H * 0.68, H * 0.26 - as, -H * 0.4, undefined, undefined, skin, armW);
  }
  if (p.role === "GK" && !pose) {
    ctx.fillStyle = "#f7f7f7";
    ctx.beginPath();
    ctx.arc(-H * 0.26 + as, -H * 0.4, H * 0.045, 0, Math.PI * 2);
    ctx.arc(H * 0.26 - as, -H * 0.4, H * 0.045, 0, Math.PI * 2);
    ctx.fill();
  }

  // Number. The body is mirrored for players facing left, so flip it back.
  ctx.save();
  ctx.scale(face / sideOn, 1);
  ctx.fillStyle = kit.number || "#fff";
  ctx.font = "bold " + Math.max(8, Math.round(H * 0.16)) + "px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(String(p.num), 0, -H * 0.62);
  ctx.restore();

  // Head, hair, and a face when he is turned toward the camera.
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.arc(0, -H * 0.9, H * 0.115, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = p.hair || "#2b1b0e";
  ctx.beginPath();
  if ((p.fy || 0) < -0.45) ctx.arc(0, -H * 0.9, H * 0.12, 0, Math.PI * 2);
  else ctx.arc(0, -H * 0.93, H * 0.12, Math.PI * 1.02, Math.PI * 1.98);
  ctx.fill();
  if ((p.fy || 0) > 0.25 && quality === "high") {
    ctx.fillStyle = "#1b1b1b";
    ctx.beginPath();
    ctx.arc(-H * 0.04, -H * 0.9, H * 0.016, 0, Math.PI * 2);
    ctx.arc(H * 0.04, -H * 0.9, H * 0.016, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  if (p.yellow > 0 && !p.sentOff && !lying) {
    ctx.fillStyle = "#ffd33d";
    ctx.strokeStyle = "rgba(0,0,0,0.55)";
    ctx.lineWidth = 1;
    ctx.fillRect(foot.x + H * 0.22, foot.y - H - 2, 5, 7);
    ctx.strokeRect(foot.x + H * 0.22, foot.y - H - 2, 5, 7);
  }
}

function drawPlayerHud(p, c) {
  const foot = w2s(p.x, p.y, 0);
  const H = 34 * ZMUL * foot.s;
  const mine = isLocal(c);
  const label = (labelFor(c) || "") + "  #" + p.num;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "bold " + Math.max(11, Math.round(12 + foot.s * 2)) + "px Arial";
  const y = foot.y - H - 12;
  ctx.lineWidth = 3;
  ctx.strokeStyle = "rgba(0,0,0,0.75)";
  ctx.strokeText(label, foot.x, y);
  ctx.fillStyle = mine ? "#ffd33d" : TEAMS[p.team].ui;
  ctx.fillText(label, foot.x, y);
  // Little marker bouncing over the name.
  const bob = Math.sin(viewTime * 5 + p.num) * 2;
  ctx.fillStyle = mine ? "#ffd33d" : "#fff";
  ctx.beginPath();
  ctx.moveTo(foot.x, y - 10 + bob);
  ctx.lineTo(foot.x - 4, y - 16 + bob);
  ctx.lineTo(foot.x + 4, y - 16 + bob);
  ctx.closePath();
  ctx.fill();
  if (mine) {
    const bw = Math.max(28, 34 * foot.s);
    const by = foot.y + Math.max(5, 6 * foot.s);
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    roundRect(ctx, foot.x - bw / 2, by, bw, 4, 2);
    ctx.fill();
    const st = clamp(p.stamina == null ? 1 : p.stamina, 0, 1);
    ctx.fillStyle = st > 0.55 ? "#3dde5a" : st > 0.28 ? "#ffd33d" : "#ff4d3a";
    ctx.fillRect(foot.x - bw / 2 + 1, by + 1, (bw - 2) * st, 2);
  }
  if (c.charging) {
    const ch = clamp(c.held / CHARGE_TIME, 0, 1);
    const bw = Math.max(40, 52 * foot.s);
    const py = y - 14;
    ctx.fillStyle = "rgba(0,0,0,0.65)";
    roundRect(ctx, foot.x - bw / 2, py, bw, 7, 2);
    ctx.fill();
    ctx.fillStyle = ch < 0.5 ? "#ffd33d" : ch < 0.85 ? "#ff9f1c" : "#ff3b3b";
    ctx.fillRect(foot.x - bw / 2 + 1, py + 1, (bw - 2) * ch, 5);
    if (game.penalty && game.penalty.taker === p) {
      ctx.fillStyle = "rgba(255,59,59,0.45)";
      ctx.fillRect(foot.x - bw / 2 + 1 + (bw - 2) * PEN_RISKY, py + 1, (bw - 2) * (1 - PEN_RISKY), 5);
    }
    if (c.charging === "pass" && c.held >= TAP_TIME) {
      ctx.fillStyle = "#fff";
      ctx.font = "bold 9px Arial";
      ctx.fillText("LOB", foot.x, py - 8);
    }
  }
}

function drawBall() {
  const b = ballSrc || ball;
  if (!b) return;
  const z = b.z || 0;
  const gnd = w2s(b.x, b.y, 0);
  const sh = clamp(1 - z / 170, 0.32, 1);
  ctx.fillStyle = "rgba(0,0,0," + clamp(0.45 - z / 210, 0.07, 0.45).toFixed(3) + ")";
  ctx.beginPath();
  ctx.ellipse(
    gnd.x + (4 + z * 0.22) * gnd.s,
    gnd.y + 1.6 * gnd.s,
    BALL_R * gnd.s * 1.45 * sh,
    BALL_R * gnd.s * 0.55 * sh,
    0, 0, Math.PI * 2
  );
  ctx.fill();
  const p = w2s(b.x, b.y, z);
  const r = Math.max(3.2, BALL_R * p.s * (1 + z / 340));
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(b.spin || 0);
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = "#f7f7f7";
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.fillStyle = "#1c1c1c";
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.26, 0, Math.PI * 2);
  ctx.fill();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * r * 0.62, Math.sin(a) * r * 0.62, r * 0.2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  if (quality === "high") {
    const grad = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.08, 0, 0, r);
    grad.addColorStop(0, "rgba(255,255,255,0.75)");
    grad.addColorStop(0.5, "rgba(255,255,255,0)");
    grad.addColorStop(1, "rgba(0,0,0,0.38)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawPenaltyAids() {
  const pen = game.penalty;
  if (!pen || !(game.phase === "setpiece" || game.phase === "shootout")) return;
  const mine = localActives();
  const A = TEAMS[pen.team];
  const src = ballSrc || ball;
  if (mine.includes(pen.taker) && !mine.includes(pen.keeper)) {
    const s = w2s(A.targetGoalX, pen.aimY, CROSSBAR * 0.42);
    ctx.strokeStyle = "#ffd33d";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 10, 0, Math.PI * 2);
    ctx.moveTo(s.x - 14, s.y); ctx.lineTo(s.x + 14, s.y);
    ctx.moveTo(s.x, s.y - 14); ctx.lineTo(s.x, s.y + 14);
    ctx.stroke();
    const b = w2s(src.x, src.y, src.z || 0);
    ctx.setLineDash([5, 6]);
    ctx.strokeStyle = "rgba(255,211,61,0.55)";
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(s.x, s.y);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  if (mine.includes(pen.keeper) && !mine.includes(pen.taker)) {
    const k = pen.keeper;
    const f = w2s(k.x, k.y, 18);
    ctx.fillStyle = "rgba(120,220,255,0.95)";
    const d = pen.gkChoice;
    ctx.beginPath();
    if (!d) ctx.arc(f.x, f.y, 6, 0, Math.PI * 2);
    else {
      ctx.moveTo(f.x, f.y + d * 26);
      ctx.lineTo(f.x - 8, f.y + d * 12);
      ctx.lineTo(f.x + 8, f.y + d * 12);
      ctx.closePath();
    }
    ctx.fill();
  }
}

// =====================================================================
// HUD
// =====================================================================
function teamFlagId(side) { return (TEAMS[side] && TEAMS[side].id) || side; }
function teamFlagColors(side) {
  const k = TEAMS[side] && TEAMS[side].kit;
  return k ? [k.shirt, k.shorts, k.socks] : null;
}
function drawScoreboard() {
  const pad = screenPad();
  const x = 12 + pad.left;
  const y = 10 + pad.top;
  const h = 54;
  ctx.font = "bold 16px Arial";
  const bName = TEAMS.blue.short || "BLU";
  const rName = TEAMS.red.short || "RED";
  const bNameW = ctx.measureText(bName).width;
  const rNameW = ctx.measureText(rName).width;
  let fh = 30;
  const bRatio = flagRatio(teamFlagId("blue"));
  const rRatio = flagRatio(teamFlagId("red"));
  const clockW = 74;
  const scoreGap = 108;
  const fit = () => 8 + fh * bRatio + 8 + bNameW + 10 + scoreGap + 10 + rNameW + 8 + fh * rRatio + 8;
  let midW = fit();
  const maxW = Math.max(240, VIEW_W - x - pad.right - 58);
  if (midW + clockW > maxW) {
    fh = Math.max(16, fh * (maxW - clockW) / midW);
    midW = fit();
  }
  const w = midW + clockW;
  ctx.fillStyle = "rgba(8,12,20,0.88)";
  roundRect(ctx, x, y, w, h, 8);
  ctx.fill();

  const shine = quality === "low" ? null : (viewTime % 3.4) / 3.4;
  const flagY = y + (h - fh) / 2;
  const bFlagW = drawFlagBadge(ctx, teamFlagId("blue"), x + 8, flagY, fh, { colors: teamFlagColors("blue"), t: shine });
  const rFlagX = x + midW - 8 - fh * rRatio;
  drawFlagBadge(ctx, teamFlagId("red"), rFlagX, flagY, fh, { colors: teamFlagColors("red"), t: shine });

  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  ctx.fillStyle = "#fff";
  ctx.font = "bold 16px Arial";
  const bTextX = x + 8 + bFlagW + 8;
  ctx.fillText(bName, bTextX, y + h * 0.46);
  ctx.textAlign = "right";
  const rTextX = rFlagX - 8;
  ctx.fillText(rName, rTextX, y + h * 0.46);
  ctx.textAlign = "center";
  ctx.font = "bold 26px Arial";
  ctx.fillStyle = "#ffe14a";
  ctx.fillText(game.score.blue + "  -  " + game.score.red, x + midW / 2, y + h * 0.48);

  ctx.fillStyle = "rgba(255,255,255,0.08)";
  ctx.fillRect(x + midW, y, clockW, h);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 16px monospace";
  const left = game.timeLimit ? Math.max(0, game.timeLimit - game.clock) : 0;
  if (game.timeLimit && left < 30) ctx.fillStyle = "#ff9f1c";
  const clock = game.matchType === "shootout" || game.shootout ? "PENS" : formatClock(game.timeLimit ? Math.ceil(left) : game.clock);
  ctx.fillText(clock, x + midW + clockW / 2, y + h * 0.5);

  ctx.font = "bold 16px Arial";
  drawTeamCards("blue", bTextX + bNameW + 6, y + 14, 1);
  ctx.font = "bold 16px Arial";
  drawTeamCards("red", rTextX - rNameW - 6, y + 14, -1);

  ctx.font = "bold 12px Arial";
  ctx.textAlign = "left";
  ctx.fillStyle = "rgba(255,255,255,0.82)";
  let sub = hudSubtitle() || "";
  if (sub.length > 48) sub = sub.slice(0, 46) + "…";
  ctx.fillText(sub, x + 2, y + h + 12);
  if (game.shootout) drawShootoutDots(x, y + h + 28);
}

function drawTeamCards(team, x, y, dir) {
  let i = 0;
  for (const p of rosterList()) {
    if (p.team !== team) continue;
    const cards = p.sentOff ? ["#ff3b3b"] : p.yellow ? ["#ffd33d"] : [];
    for (const col of cards) {
      const cx = x + dir * i * 8 - (dir < 0 ? 6 : 0);
      ctx.fillStyle = col;
      ctx.fillRect(cx, y, 6, 9);
      i++;
    }
  }
}
function drawShootoutDots(x, y) {
  const so = game.shootout;
  const n = Math.max(SHOOTOUT_KICKS, so.kicks.blue.length, so.kicks.red.length);
  const w = 168 + n * 16;
  ctx.fillStyle = "rgba(8,12,20,0.88)";
  roundRect(ctx, x, y, w, 44, 8);
  ctx.fill();
  ctx.font = "bold 12px Arial";
  ctx.textBaseline = "middle";
  ["blue", "red"].forEach((t, row) => {
    const yy = y + 12 + row * 20;
    ctx.textAlign = "left";
    ctx.fillStyle = TEAMS[t].ui;
    const fh = 14;
    const fw = drawFlagBadge(ctx, teamFlagId(t), x + 8, yy - fh / 2, fh, { colors: teamFlagColors(t), t: null });
    ctx.fillText(TEAMS[t].short, x + 12 + fw, yy);
    for (let i = 0; i < n; i++) {
      const k = so.kicks[t][i];
      ctx.beginPath();
      ctx.arc(x + 78 + fw + i * 16, yy, 5, 0, Math.PI * 2);
      if (k === undefined) { ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 1.4; ctx.stroke(); }
      else { ctx.fillStyle = k ? "#2ecc40" : "#ff3b3b"; ctx.fill(); }
    }
  });
  if (so.sudden) {
    ctx.textAlign = "left";
    ctx.fillStyle = "#ff9f1c";
    ctx.font = "bold 11px Arial";
    ctx.fillText("SUDDEN DEATH", x, y + 52);
  }
}

function drawCommentary() {
  const c = game.comment;
  const pad = screenPad();
  if (c && c.timer > 0 && c.text) {
    const alpha = clamp(c.timer / 0.35, 0, 1);
    ctx.globalAlpha = alpha;
    ctx.font = "bold 15px Arial";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    const text = c.text;
    const w = Math.min(VIEW_W * 0.7, ctx.measureText(text).width + 26);
    const x = 12 + pad.left;
    const y = (game.shootout ? 132 : 78) + pad.top;
    ctx.fillStyle = "rgba(8,12,20,0.8)";
    roundRect(ctx, x, y, w, 26, 4);
    ctx.fill();
    ctx.fillStyle = "#ffe14a";
    ctx.fillRect(x, y, 4, 26);
    ctx.fillStyle = c.color || "#fff";
    ctx.fillText(text, x + 12, y + 13);
    ctx.globalAlpha = 1;
  }
  if (game.phase === "goal") {
    const t = game.celebration ? game.celebration.t : 0;
    if (t < 2.5 || isReplaying()) {
      const age = isReplaying() ? (viewTime - replayT0) : t;
      const size = Math.round(Math.min(VIEW_W, VIEW_H) * 0.16 * (1 + Math.max(0, 0.25 - age) * 1.2));
      ctx.globalAlpha = clamp(isReplaying() ? 1 : (2.5 - t) / 0.35, 0, 1);
      ctx.font = "bold " + size + "px Impact, Arial Black, Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineWidth = 8;
      ctx.strokeStyle = "rgba(0,0,0,0.72)";
      ctx.strokeText("GOAL", VIEW_W / 2, VIEW_H * 0.4);
      ctx.fillStyle = "#ffe14a";
      ctx.fillText("GOAL", VIEW_W / 2, VIEW_H * 0.4);
      const sc = game.celebration && game.celebration.scorer;
      if (sc) {
        ctx.font = "bold 20px Arial";
        ctx.fillStyle = "#fff";
        ctx.strokeStyle = "rgba(0,0,0,0.7)";
        ctx.lineWidth = 4;
        const who = "#" + sc.num + "   " + (TEAMS[sc.team].short || "");
        const ty = VIEW_H * 0.4 + size * 0.55;
        ctx.strokeText(who, VIEW_W / 2, ty);
        ctx.fillText(who, VIEW_W / 2, ty);
        const fw = ctx.measureText(who).width;
        const fh = 22;
        drawFlagBadge(ctx, teamFlagId(sc.team), VIEW_W / 2 - fw / 2 - fh * flagRatio(teamFlagId(sc.team)) - 10, ty - fh / 2, fh, { colors: teamFlagColors(sc.team), t: quality === "low" ? null : (viewTime % 3.4) / 3.4 });
      }
      ctx.globalAlpha = 1;
    }
    if (game.timer > 1 && !isReplaying()) hintBox(keysHint("skip"), VIEW_H * 0.72, 13);
  }
  const mine = localActives();
  const pen = game.penalty;
  if (pen && (game.phase === "setpiece" || game.phase === "shootout")) {
    if (mine.includes(pen.taker)) hintBox("PENALTY: " + keysHint("penTaker"), VIEW_H * 0.72);
    else if (mine.includes(pen.keeper)) hintBox("YOU'RE IN GOAL: " + keysHint("penKeeper"), VIEW_H * 0.72);
  } else if (game.phase === "setpiece") {
    const sp = game.setpiece;
    if (sp && sp.taker && mine.includes(sp.taker)) {
      const names = { kickoff: "Kick off", throw: "Throw-in", corner: "Corner", goalkick: "Goal kick", free: sp.indirect ? "Indirect free kick (pass first!)" : "Free kick" };
      hintBox(names[sp.type] + ": " + keysHint("setpiece"), VIEW_H * 0.72);
    }
  }
}
function hintBox(txt, y, size) {
  if (!txt) return;
  size = size || 15;
  ctx.font = "bold " + size + "px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const w = Math.min(VIEW_W - 16, ctx.measureText(txt).width + 24);
  ctx.fillStyle = "rgba(0,0,0,0.62)";
  roundRect(ctx, VIEW_W / 2 - w / 2, y, w, size + 12, 6);
  ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.fillText(txt, VIEW_W / 2, y + (size + 12) / 2);
}

let bugId = "";
let bugUntil = 0;
function drawMatchBugs(replayOn) {
  const ko = game.phase === "setpiece" && game.setpiece && game.setpiece.type === "kickoff";
  if (ko) {
    if (bugId !== "ko") { bugId = "ko"; bugUntil = viewTime + 1.6; }
    if (viewTime < bugUntil) centerTitle("KICK OFF");
  } else if (bugId === "ko") bugId = "";
  if (game.phase === "win") centerTitle("FULL TIME");
  else if (game.phase === "shootout" && game.shootout && game.shootout.kicks.blue.length + game.shootout.kicks.red.length === 0 && game.timer > 0.6) centerTitle("PENALTIES");
  else if (game.timeLimit && game.phase === "play" && game.clock >= game.timeLimit / 2 && game.clock < game.timeLimit / 2 + 2.1) centerTitle("SECOND HALF");
  if (replayOn) {
    const pad = screenPad();
    ctx.font = "bold 14px Arial";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    // Keep clear of the pause button in the top-right corner.
    const x = VIEW_W - 108 - pad.right;
    const y = 22 + pad.top;
    ctx.fillStyle = "rgba(180, 24, 24, 0.92)";
    roundRect(ctx, x, y - 12, 78, 24, 4);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.fillText("REPLAY", x + 70, y);
  }
}
function centerTitle(text) {
  ctx.save();

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.lineWidth = 8;
  ctx.strokeStyle = "rgba(0,0,0,0.62)";

  ctx.restore();
}

function drawRefPopups() {

    roundRect(ctx, -160, -74, 320, 148, 12);

    ctx.save();

    ctx.restore();

const confetti = [];
let lastConfettiTime = 0, confettiFor = null;
function updateConfetti() {
  const now = performance.now() / 1000;
  const dt = Math.min(0.05, now - (lastConfettiTime || now));
  lastConfettiTime = now;
  const key = game.phase === "goal" && game.celebration ? "goal" + game.score.blue + "-" + game.score.red
    : game.phase === "win" && game.winner ? "win" : null;
  if (key && key !== confettiFor) {
    confettiFor = key;
    const team = key === "win" ? game.winner : game.lastScorer;
    const cols = [TEAMS[team].kit.shirt, TEAMS[team].kit.shorts, "#ffd33d", "#ffffff"];
    const n = quality === "low" ? 60 : 130;
    for (let i = 0; i < n; i++) {
      confetti.push({
        x: Math.random() * VIEW_W, y: -20 - Math.random() * VIEW_H * 0.5,
        vx: (Math.random() - 0.5) * 70, vy: 70 + Math.random() * 130,
        r: Math.random() * 6, vr: (Math.random() - 0.5) * 8,
        c: cols[i % cols.length], w: 5 + Math.random() * 5,
      });
    }
  }
  if (!key) confettiFor = null;
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i];
    c.x += c.vx * dt + Math.sin(now * 3 + i) * 0.5;
    c.y += c.vy * dt;
    c.r += c.vr * dt;
    if (c.y > VIEW_H + 20) confetti.splice(i, 1);
  }
}
function drawConfetti() {
  for (const c of confetti) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.r);
    ctx.scale(1, Math.abs(Math.cos(c.r * 2)) + 0.2);
    ctx.fillStyle = c.c;
    ctx.fillRect(-c.w / 2, -2, c.w, 4);
    ctx.restore();
  }
}

function drawMinimap() {
  const mw = 150, mh = mw * PITCH.h / PITCH.w;
  const mx = VIEW_W / 2 - mw / 2;
  const my = VIEW_H - mh - 12 - screenPad().bottom;
  const sx = (x) => mx + (x - PITCH.left) / PITCH.w * mw;
  const sy = (y) => my + (y - PITCH.top) / PITCH.h * mh;
  ctx.fillStyle = "rgba(6,16,10,0.72)";
  roundRect(ctx, mx - 5, my - 5, mw + 10, mh + 10, 6);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.7)";
  ctx.lineWidth = 1;
  ctx.strokeRect(mx, my, mw, mh);
  ctx.beginPath();
  ctx.moveTo(mx + mw / 2, my);
  ctx.lineTo(mx + mw / 2, my + mh);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(mx + mw / 2, my + mh / 2, CIRCLE_R / PITCH.w * mw, 0, Math.PI * 2);
  ctx.stroke();
  const dots = shownOfficials || game.officials || [];
  for (const o of dots) {
    ctx.fillStyle = o.role === "ref" ? "#ffe14a" : "#f0d060";
    const py = clamp(o.y, PITCH.top, PITCH.bottom);
    ctx.fillRect(sx(o.x) - 1.6, sy(py) - 1.6, 3.2, 3.2);
  }
  for (const p of onPitch()) {
    ctx.fillStyle = p.role === "GK" ? TEAMS[p.team].gk.shirt : TEAMS[p.team].kit.shirt;
    ctx.beginPath();
    ctx.arc(sx(p.x), sy(p.y), 2.6, 0, Math.PI * 2);
    ctx.fill();
    if (isHumanControlled(p)) { ctx.strokeStyle = "#ffd33d"; ctx.lineWidth = 1; ctx.stroke(); }
  }
  const src = ballSrc || ball;
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(sx(src.x), sy(src.y), 2.4, 0, Math.PI * 2);
  ctx.fill();
  const cam = game.camera;
  const s = scaleAtT(depthT(PITCH.cy), cam.zoom || 1);
  const half = VIEW_W / 2 / Math.max(0.25, s);
  ctx.strokeStyle = "rgba(255,211,61,0.85)";
  ctx.lineWidth = 1;
  const x0 = clamp(sx(cam.cx - half), mx, mx + mw);
  const x1 = clamp(sx(cam.cx + half), mx, mx + mw);
  ctx.strokeRect(x0, my, Math.max(2, x1 - x0), mh);
}

let vignette = null, vignetteKey = "";
function drawVignette() {
  if (quality === "low") return;
  const key = VIEW_W + "x" + VIEW_H;
  if (key !== vignetteKey || !vignette) {
    vignetteKey = key;
    vignette = ctx.createRadialGradient(VIEW_W / 2, VIEW_H * 0.46, VIEW_H * 0.28, VIEW_W / 2, VIEW_H * 0.5, VIEW_H * 0.78);
    vignette.addColorStop(0, "rgba(0,0,0,0)");
    vignette.addColorStop(1, "rgba(0,0,0,0.42)");
  }
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}

const onPitch = () => players.filter((p) => !p.sentOff);

let qCool = 0;
const qSamples = [];
function considerQuality() {
  const now = performance.now();
  if (!considerQuality.prev) { considerQuality.prev = now; return; }
  const ms = now - considerQuality.prev;
  considerQuality.prev = now;
  if (ms > 80) return;
  qCool--;
  qSamples.push(ms);
  if (qSamples.length > 36) qSamples.shift();
  if (qSamples.length < 28 || qCool > 0) return;
  const avg = qSamples.reduce((a, b) => a + b, 0) / qSamples.length;
  if (quality === "high" && avg > 26) { quality = "low"; qCool = 150; qSamples.length = 0; resize(); }
  else if (quality === "low" && avg < 13) { quality = "high"; qCool = 150; qSamples.length = 0; resize(); }
}

function draw() {
  if (!ctx) return;
  if (!crowdSheet) renderBackground();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#07090d";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(viewScale * dpr, 0, 0, viewScale * dpr, 0, 0);

  const replayOn = isReplaying();
  const sample = replayOn ? replaySample() : null;
  ballSrc = sample ? sample.ball : ball;
  const cast = sample ? sample.ps.filter((p) => p && !p.sentOff) : onPitch();
  shownOfficials = (sample && sample.offs && sample.offs.length) ? sample.offs : (game.officials || []);

  drawSky();
  drawTower(PITCH.left + 36, PITCH.top - 4, true);
  drawTower(PITCH.right - 36, PITCH.top - 4, true);
  drawFarStands();
  drawEndStands();
  drawPitch();
  drawMarkings();
  drawBoards(false);
  drawGoals();

  const crew = shownOfficials || [];
  const things = cast.map((p) => ({ y: p.y, p: p }));
  for (const o of crew) if (o.side !== "near") things.push({ y: o.y, o: o });
  const bz = (ballSrc && ballSrc.z) || 0;
  if (bz <= 14) things.push({ y: ballSrc.y + 0.2, ball: true });
  things.sort((a, b) => a.y - b.y);
  for (const t of things) { if (t.ball) drawBall(); else if (t.o) drawOfficial(t.o); else drawPlayer(t.p); }
  if (bz > 14) drawBall();

  drawBoards(true);
  drawNearStands();
  for (const o of crew) if (o.side === "near") drawOfficial(o);
  drawTower(PITCH.left + 48, PITCH.bottom + 14, false);
  drawTower(PITCH.right - 48, PITCH.bottom + 14, false);
  drawPenaltyAids();

  if (!replayOn && controllers) {
    for (const c of controllers) {
      if (!c.cpu && c.active && !c.active.sentOff && (inMatch() || game.phase === "win")) drawPlayerHud(c.active, c);
    }
  }

  drawVignette();
  updateConfetti();
  if (showHud()) {
    drawScoreboard();
    drawCommentary();
    drawRefPopups();
    drawMatchBugs(replayOn);
    if (!game.shootout && game.phase !== "goal") drawMinimap();
  }
  drawConfetti();
  ballSrc = ball;
  considerQuality();
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// =====================================================================
// Screen size
// =====================================================================
let viewScale = 1, dpr = 1;
let safeCss = { top: 0, right: 0, bottom: 0, left: 0 };
function readSafeArea() {
  safeCss = { top: 0, right: 0, bottom: 0, left: 0 };
  const el = document.getElementById("safeProbe");
  if (!el) return;
  const cs = getComputedStyle(el);
  safeCss.top = parseFloat(cs.borderTopWidth) || 0;
  safeCss.right = parseFloat(cs.borderRightWidth) || 0;
  safeCss.bottom = parseFloat(cs.borderBottomWidth) || 0;
  safeCss.left = parseFloat(cs.borderLeftWidth) || 0;
}
function screenPad() {
  const s = Math.max(viewScale, 0.001);
  return { top: safeCss.top / s, bottom: safeCss.bottom / s, left: safeCss.left / s, right: safeCss.right / s };
}
function viewportBox() {
  const vv = window.visualViewport;
  return {
    w: Math.max(1, Math.round((vv && vv.width) || window.innerWidth || 1)),
    h: Math.max(1, Math.round((vv && vv.height) || window.innerHeight || 1)),
    x: (vv && vv.offsetLeft) || 0,
    y: (vv && vv.offsetTop) || 0,
  };
}
function resize() {
  if (!canvas) return;
  const touch = typeof touchActive === "function" && touchActive();
  const cap = quality === "low" ? 1.25 : touch ? 1.5 : 2;
  dpr = Math.min(window.devicePixelRatio || 1, cap);
  const box = viewportBox();
  const w = box.w, h = box.h, aspect = w / Math.max(1, h);
  VIEW_H = 640;
  VIEW_W = VIEW_H * aspect;
  if (VIEW_W < 900) { VIEW_W = 900; VIEW_H = VIEW_W / aspect; }
  viewScale = w / VIEW_W;
  readSafeArea();
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  canvas.style.left = box.x + "px";
  canvas.style.top = box.y + "px";
  vignette = null;
  if (typeof game !== "undefined" && game) updateCamera(0, true);
  if (typeof updateScreens === "function") updateScreens();
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 80));
if (window.visualViewport) {
  visualViewport.addEventListener("resize", resize);
  visualViewport.addEventListener("scroll", resize);
}

// =====================================================================
// OFFLINE SHELL
// =====================================================================
/* =====================================================================
   OFFLINE SHELL - menus, keyboard/touch, Cup + Shootout modes
   ---------------------------------------------------------------------
   The match itself runs in createSim() (the GAME LOGIC above - the very
   same code the online server runs). This part:
     A. OFFLINE STATE + SETTINGS (saved in localStorage)
     B. INPUT (keyboard for 1 or 2 players, touch joystick + buttons)
     C. HOOKS the drawing code asks for (names, hints...)
     D. STARTING MATCHES (quick match, cup match, penalty shootout)
     E. MENU + TEAM PICKER
     F. CUP MODE (8-team knockout, bracket, trophy)
     G. WIN / PAUSE SCREENS
     H. MAIN LOOP + DEBUG HOOK (for automated tests)
   ===================================================================== */

// =====================================================================
// A. OFFLINE STATE + SETTINGS
// =====================================================================
const $ = (id) => document.getElementById(id);
let sim = null;                 // the running match (createSim)
let game, players, ball, controllers;   // shortcuts the drawing code uses
let atMenu = true;              // a menu screen is showing (the match is not running)
let paused = false;
let matchKind = "quick";        // what is being played: "quick" | "cup" | "shootout"
let matchStartedAt = 0;         // for the little controls hint

// What the player picked in the menu (saved between visits)
const settings = {
  kind: "quick",                // quick | cup | shootout
  mode: "1p",                   // 1p | 2p
  difficulty: "normal",
  blue: "blue", red: "red",     // team ids (or "custom")
  rules: { offside: true, cards: true },
  custom: { name: "My Team", shirt: "#8e44ad", shorts: "#ffffff", socks: "#8e44ad" },
  muted: false,
};
function loadSettings() {
  try { Object.assign(settings, JSON.parse(localStorage.getItem("soccerSettings") || "{}")); } catch (e) { /* ignore */ }
  settings.rules = { ...DEFAULT_RULES, ...(settings.rules || {}) };
}
function saveSettings() { try { localStorage.setItem("soccerSettings", JSON.stringify(settings)); } catch (e) { /* ignore */ } }
// A team id -> full team (the custom team is built from your colours)
const teamDef = (id) => (id === "custom" ? customTeam(settings.custom) : findTeam(id) || TEAM_LIST[0]);

const inMatch = () => !!sim && !atMenu && ["setpiece", "play", "dead", "goal", "shootout", "pkflight"].includes(game.phase);
const isTouchDevice = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0) || (window.matchMedia && matchMedia("(pointer: coarse)").matches);
const touchActive = () => isTouchDevice;
const splitTouch = () => touchActive() && settings.mode === "2p";
const isPortrait = () => {
  const vv = window.visualViewport;
  const w = (vv && vv.width) || window.innerWidth;
  const h = (vv && vv.height) || window.innerHeight;
  return h > w;
};
const controllerOf = (p) => (game.autoplay ? null : controllers.find((c) => !c.cpu && c.active === p) || null);
const isHumanControlled = (p) => !!controllerOf(p);
const updateScreens = () => updateHud();   // the drawing code calls this after a resize

// =====================================================================
// B. INPUT
// =====================================================================
const keys = {};
// Which keys each human uses. 1 player: both key sets work.
function controlScheme(id) {
  const one = settings.mode === "1p";
  if (id === "p1") return {
    up: one ? ["KeyW", "ArrowUp"] : ["KeyW"], down: one ? ["KeyS", "ArrowDown"] : ["KeyS"],
    left: one ? ["KeyA", "ArrowLeft"] : ["KeyA"], right: one ? ["KeyD", "ArrowRight"] : ["KeyD"],
    shoot: ["Space"], pass: ["KeyE"], sprint: one ? ["ShiftLeft", "ShiftRight"] : ["ShiftLeft"], swap: ["KeyQ"],
    skill: ["KeyR"], flick: ["KeyF"],
  };
  return {
    up: ["ArrowUp"], down: ["ArrowDown"], left: ["ArrowLeft"], right: ["ArrowRight"],
    shoot: ["Enter", "NumpadEnter"], pass: ["ShiftRight"], sprint: ["Slash", "ControlRight"], swap: ["Period"],
    skill: ["Quote"], flick: ["Semicolon"],
  };
}
const humanIds = () => (settings.mode === "2p" ? ["p1", "p2"] : ["p1"]);

window.addEventListener("keydown", (e) => {
  if (e.target && e.target.tagName === "INPUT") return;   // typing a team name
  if (inMatch() && ["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Enter", "Slash", "Period", "Tab", "Quote"].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) onKeyPressed(e.code);
  keys[e.code] = true;
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });
window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

function onKeyPressed(code) {
  if (!inMatch()) return;
  if (code === "KeyP" || code === "Escape") { togglePause(); return; }
  if (code === "KeyM") { toggleSound(); return; }
  if (paused) return;
  // any key skips a goal celebration
  if (game.phase === "goal") { sim.press("p1", "skip"); return; }
  for (const id of humanIds()) {
    const s = controlScheme(id);
    for (const action of ["shoot", "pass", "swap", "skill", "flick"]) if (s[action].includes(code)) sim.press(id, action);
  }
}
const isDown = (id, action) => controlScheme(id)[action].some((c) => keys[c]) || (touchActive() && !!(pads[id] && pads[id][action]));

// Read the keys / joystick into the match every frame
function feedInput() {
  for (const id of humanIds()) {
    let mx = 0, my = 0;
    if (isDown(id, "left")) mx -= 1;
    if (isDown(id, "right")) mx += 1;
    if (isDown(id, "up")) my -= 1;
    if (isDown(id, "down")) my += 1;
    const pad = touchActive() ? pads[id] : null;
    if (pad && !mx && !my) { mx = pad.x; my = pad.y; }
    sim.setInput(id, { mx, my, sprint: isDown(id, "sprint"), shoot: isDown(id, "shoot"), pass: isDown(id, "pass") });
  }
}

// ---- Touch joysticks + buttons (player 2's pad is used in 2 Players) ----
function bindPad(playerId, ids) {
  const zone = $(ids.zone), base = $(ids.base), knob = $(ids.knob);
  const pad = { x: 0, y: 0, pointerId: null, baseX: 0, baseY: 0, shoot: false, pass: false, sprint: false, skill: false };
  if (!zone || !base || !knob) return pad;
  function movePad(e) {
    let dx = e.clientX - pad.baseX, dy = e.clientY - pad.baseY;
    const len = Math.hypot(dx, dy);
    const max = Math.max(36, base.offsetWidth * 0.42);
    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    pad.x = dx / max; pad.y = dy / max;
    if (Math.hypot(pad.x, pad.y) < 0.15) { pad.x = 0; pad.y = 0; }
    knob.style.transform = "translate(" + dx + "px," + dy + "px)";
  }
  zone.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (inMatch() && game.phase === "goal") sim.press(playerId, "skip");
    pad.pointerId = e.pointerId; pad.baseX = e.clientX; pad.baseY = e.clientY;
    base.style.left = (e.clientX - base.offsetWidth / 2) + "px";
    base.style.top = (e.clientY - base.offsetHeight / 2) + "px";
    base.style.right = "auto"; base.style.bottom = "auto";
    try { zone.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    movePad(e);
  });
  zone.addEventListener("pointermove", (e) => { if (e.pointerId === pad.pointerId) movePad(e); });
  function release(e) {
    if (e.pointerId !== pad.pointerId) return;
    pad.pointerId = null; pad.x = 0; pad.y = 0; knob.style.transform = "";
    // Put the stick back in its corner. Leaving it under the finger
    // can park half of it off the bottom of a phone.
    base.style.left = ""; base.style.top = ""; base.style.right = ""; base.style.bottom = "";
  }
  zone.addEventListener("pointerup", release);
  zone.addEventListener("pointercancel", release);
  for (const [id, action] of [[ids.shoot, "shoot"], [ids.pass, "pass"], [ids.sprint, "sprint"], [ids.skill, "skill"]]) {
    const el = $(id);
    if (!el) continue;
    el.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      pad[action] = true; el.classList.add("pressed");
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      if (inMatch() && !paused) {
        if (game.phase === "goal") sim.press(playerId, "skip");
        else if (action !== "sprint") sim.press(playerId, action);
      }
    });
    const up = () => { pad[action] = false; el.classList.remove("pressed"); };
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
  }
  return pad;
}
const pads = {
  p1: bindPad("p1", { zone: "joyZone", base: "joyBase", knob: "joyKnob", shoot: "shootBtn", pass: "passBtn", sprint: "sprintBtn", skill: "skillBtn" }),
  p2: bindPad("p2", { zone: "joyZone2", base: "joyBase2", knob: "joyKnob2", shoot: "shootBtn2", pass: "passBtn2", sprint: "sprintBtn2", skill: "skillBtn2" }),
};

// Build a new match. opts: {kind, blue, red (team defs), winScore, timeLimit, knockout, matchType}
function newMatch(opts) {
  const kits = buildTeamKits(opts.blue, opts.red);
  applyTeamKits(kits);
  renderBackground();         // the fans in the stands wear the new colours
  sim = createSim({
    mode: settings.mode === "2p" ? "2 players" : "1 player", difficulty: settings.difficulty, teams: kits,
    rules: settings.rules, winScore: opts.winScore, timeLimit: opts.timeLimit, knockout: opts.knockout, matchType: opts.matchType,
  });
  game = sim.game; ball = sim.ball; controllers = sim.controllers; players = sim.players;
  sim.addController("p1", "P1", "blue");
  if (settings.mode === "2p") sim.addController("p2", "P2", "red");
  matchKind = opts.kind;
  confetti.length = 0;        // no confetti left over from the last match
  sim.start();
  players = sim.players;
  atMenu = false; paused = false; matchStartedAt = performance.now();
  Sound.init(); Sound.setMuted(settings.muted);
  showScreen(null);
  updateCamera(0, true);
}
function startQuickMatch() {
  newMatch({ kind: "quick", blue: teamDef(settings.blue), red: teamDef(settings.red), winScore: WIN_SCORE });
}
function startShootoutMatch() {
  newMatch({ kind: "shootout", blue: teamDef(settings.blue), red: teamDef(settings.red), matchType: "shootout" });
}
function startFromMenu() {
  saveSettings();
  if (settings.kind === "cup") { newCup(); return; }
  if (settings.kind === "shootout") startShootoutMatch(); else startQuickMatch();
}

// =====================================================================
// F. CUP MODE  (8 teams: quarter-finals, semi-finals, final)
// =====================================================================
const CUP_ROUND_NAMES = ["Quarter-final", "Semi-final", "Final"];
let cup = null;
function loadCup() { try { return JSON.parse(localStorage.getItem("soccerCup") || "null"); } catch (e) { return null; } }
function saveCup() { try { localStorage.setItem("soccerCup", JSON.stringify(cup)); } catch (e) { /* ignore */ } }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// A new cup: your team + 7 random others. teams[0] is always you.
function newCup() {
  const mine = teamDef(settings.blue);
  const others = shuffle(TEAM_LIST.filter((t) => t.id !== mine.id)).slice(0, 7);
  const teams = [mine, ...others];
  const order = shuffle([1, 2, 3, 4, 5, 6, 7]);
  order.splice(Math.floor(Math.random() * 4) * 2, 0, 0);   // you go somewhere in the draw
  const qf = [];
  for (let i = 0; i < 8; i += 2) qf.push({ a: order[i], b: order[i + 1], sa: null, sb: null, pens: null, winner: null });
  cup = { teams, rounds: [qf, [], []], round: 0, over: false, champion: null, out: false, difficulty: settings.difficulty };
  saveCup();
  showCup();
}
const myCupMatch = () => cup.rounds[cup.round].find((m) => m.a === 0 || m.b === 0) || null;

// Results of computer vs computer matches (better rating = better chance)
function simulateCupMatch(m) {
  const ra = cup.teams[m.a].rating || 3, rb = cup.teams[m.b].rating || 3;
  const goals = (r, o) => { let g = 0; for (let i = 0; i < 6; i++) if (Math.random() < 0.28 + 0.06 * (r - o)) g++; return Math.min(g, CUP_WIN_SCORE); };
  m.sa = goals(ra, rb); m.sb = goals(rb, ra);
  if (m.sa === CUP_WIN_SCORE && m.sb === CUP_WIN_SCORE) { if (Math.random() < 0.5 + 0.08 * (ra - rb)) m.sb--; else m.sa--; }
  if (m.sa === m.sb) {
    // penalties!
    let pa = 0, pb = 0;
    for (let i = 0; i < 5; i++) { if (Math.random() < 0.75) pa++; if (Math.random() < 0.75) pb++; }
    while (pa === pb) { if (Math.random() < 0.75) pa++; if (Math.random() < 0.75) pb++; }
    m.pens = [pa, pb];
  }
  m.winner = m.sa > m.sb || (m.pens && m.pens[0] > m.pens[1]) ? m.a : m.b;
}
// Finish the current round: play the other matches, draw the next round
function finishCupRound() {
  for (const m of cup.rounds[cup.round]) if (m.winner === null) simulateCupMatch(m);
  const winners = cup.rounds[cup.round].map((m) => m.winner);
  if (cup.round === 2) { cup.over = true; cup.champion = winners[0]; }
  else {
    cup.round++;
    cup.rounds[cup.round] = [];
    for (let i = 0; i < winners.length; i += 2) cup.rounds[cup.round].push({ a: winners[i], b: winners[i + 1], sa: null, sb: null, pens: null, winner: null });
  }
  if (cup.out && !cup.over) finishCupRound();   // you're out: the cup plays on without you
}
function playCupMatch() {
  const m = myCupMatch();
  if (!m) return;
  const oppIdx = m.a === 0 ? m.b : m.a;
  settings.difficulty = cup.difficulty || settings.difficulty; settings.mode = "1p";
  newMatch({ kind: "cup", blue: cup.teams[0], red: cup.teams[oppIdx], winScore: CUP_WIN_SCORE, timeLimit: CUP_TIME_LIMIT, knockout: true });
}
// Called when your cup match ends
function recordCupResult() {
  const m = myCupMatch();
  if (!m) return;
  const meA = m.a === 0;
  const so = game.shootout;
  m.sa = meA ? game.score.blue : game.score.red; m.sb = meA ? game.score.red : game.score.blue;
  if (so) {
    const pb = so.kicks.blue.reduce((x, y) => x + y, 0), pr = so.kicks.red.reduce((x, y) => x + y, 0);
    m.pens = meA ? [pb, pr] : [pr, pb];
  }
  const iWon = game.winner === "blue";
  m.winner = iWon ? 0 : meA ? m.b : m.a;
  if (!iWon) cup.out = true;
  finishCupRound();
  saveCup();
}

function matchLine(m) {
  if (m.a === undefined || m.a === null) return "<div class='cm tbd'>?</div>";
  const T = (i) => cup.teams[i];
  const row = (i, s, pen) => "<div class='ct" + (m.winner === i ? " won" : m.winner !== null ? " lost" : "") + (i === 0 ? " me" : "") + "'>" +
    flagHtml(T(i), 18) + "<span class='nm'>" + esc(T(i).name) + "</span><span class='sc'>" + (s === null ? "" : s) + (pen !== null && pen !== undefined ? " <small>(" + pen + ")</small>" : "") + "</span></div>";
  return "<div class='cm" + (m.a === 0 || m.b === 0 ? " mine" : "") + "'>" + row(m.a, m.sa, m.pens && m.pens[0]) + row(m.b, m.sb, m.pens && m.pens[1]) + "</div>";
}
function showCup() {
  atMenu = true; paused = false;
  let html = "";
  for (let r = 0; r < 3; r++) {
    const list = cup.rounds[r].length ? cup.rounds[r] : new Array(4 >> r).fill({});
    html += "<div class='col'><div class='label'>" + CUP_ROUND_NAMES[r] + "</div>" + list.map(matchLine).join("") + "</div>";
  }
  $("bracket").innerHTML = html;
  $("cupFormat").textContent = "Each match: first to " + CUP_WIN_SCORE + " goals or " + formatClock(CUP_TIME_LIMIT) + " \u2022 a draw = penalty shootout";
  const m = cup.over ? null : myCupMatch();
  let status;
  if (cup.over) status = cup.champion === 0 ? "\ud83c\udfc6 You won the cup!" : esc(cup.teams[cup.champion].name) + " won the cup." + (cup.out ? " You were knocked out - try again!" : "");
  else if (m) { const opp = cup.teams[m.a === 0 ? m.b : m.a]; status = CUP_ROUND_NAMES[cup.round] + ": " + esc(cup.teams[0].name) + " vs " + esc(opp.name); }
  else status = "";
  $("cupStatus").innerHTML = status;
  $("cupPlayBtn").classList.toggle("hidden", !m);
  if (m) $("cupPlayBtn").textContent = "PLAY " + CUP_ROUND_NAMES[cup.round].toUpperCase();
  $("cupTrophyBtn").classList.toggle("hidden", !(cup.over && cup.champion === 0));
  $("cupNewBtn").classList.toggle("hidden", !cup.over);
  showScreen("cupScreen");
}

// ---- Trophy ceremony: a shining cup, confetti and the crowd going wild ----
let trophyAnim = null;
function showTrophy() {
  showScreen("trophyScreen");
  $("trophyTeam").innerHTML = cup ? flagHtml(cup.teams[0], 28, { wave: true }) + "<span>" + esc(cup.teams[0].name) + "</span>" : "";
  Sound.init(); Sound.fanfare();
  const cv = $("trophyCanvas"), g = cv.getContext("2d");
  const W = cv.width = 360, H = cv.height = 300;
  const kit = cup ? cup.teams[0].home : ["#ffd33d", "#fff", "#fff"];
  const bits = [];
  for (let i = 0; i < 140; i++) bits.push({ x: Math.random() * W, y: -Math.random() * H, v: 40 + Math.random() * 90, r: Math.random() * 6, c: [kit[0], kit[1], "#ffd33d", "#fff"][i % 4] });
  const t0 = performance.now();
  cancelAnimationFrame(trophyAnim);
  const loop = (now) => {
    if ($("trophyScreen").classList.contains("hidden")) return;
    const t = (now - t0) / 1000;
    g.clearRect(0, 0, W, H);
    // light rays
    g.save(); g.translate(W / 2, 150); g.rotate(t * 0.3);
    for (let i = 0; i < 12; i++) { g.rotate(Math.PI / 6); g.fillStyle = "rgba(255,230,120,0.10)"; g.beginPath(); g.moveTo(0, 0); g.lineTo(-25, -220); g.lineTo(25, -220); g.fill(); }
    g.restore();
    // the trophy (rises up and bobs)
    const rise = Math.min(1, t / 1.2), y = 40 + (1 - rise) * 200 + Math.sin(t * 2) * 4;
    g.save(); g.translate(W / 2, y);
    const gold = g.createLinearGradient(-60, 0, 60, 0);
    const sh = (Math.sin(t * 2.5) + 1) / 2;
    gold.addColorStop(0, "#a87a00"); gold.addColorStop(clamp(sh, 0.05, 0.95), "#fff6c0"); gold.addColorStop(1, "#c99a06");
    g.fillStyle = gold; g.strokeStyle = "#7a5700"; g.lineWidth = 3;
    g.beginPath(); g.moveTo(-55, 0); g.quadraticCurveTo(-60, 95, 0, 110); g.quadraticCurveTo(60, 95, 55, 0); g.closePath(); g.fill(); g.stroke();     // bowl
    g.beginPath(); g.ellipse(-62, 35, 18, 28, 0, 0, Math.PI * 2); g.ellipse(62, 35, 18, 28, 0, 0, Math.PI * 2); g.lineWidth = 7; g.strokeStyle = gold; g.stroke(); // handles
    g.fillStyle = gold; g.fillRect(-10, 108, 20, 40); g.fillRect(-40, 148, 80, 14); g.fillStyle = "#5b3b1a"; g.fillRect(-50, 162, 100, 30);       // stem + base
    g.fillStyle = "#ffd33d"; g.font = "bold 12px Arial"; g.textAlign = "center"; g.fillText("CHAMPIONS", 0, 182);
    g.restore();
    for (const b of bits) {
      b.y += b.v / 60; b.r += 0.1; if (b.y > H) { b.y = -10; b.x = Math.random() * W; }
      g.save(); g.translate(b.x, b.y); g.rotate(b.r); g.fillStyle = b.c; g.fillRect(-4, -2, 8, 4); g.restore();
    }
    trophyAnim = requestAnimationFrame(loop);
  };
  trophyAnim = requestAnimationFrame(loop);
}

// =====================================================================
// G. WIN / PAUSE SCREENS
// =====================================================================
function togglePause() {
  paused = !paused;
  showScreen(paused ? "pauseScreen" : null);
}
function toggleSound() {
  settings.muted = !settings.muted; Sound.setMuted(settings.muted); saveSettings();
}
function showWin() {
  const w = game.winner;
  const so = game.shootout;
  $("winTitle").textContent = w ? TEAMS[w].name + " win!" : "It's a draw!";
  $("winTitle").style.color = w ? TEAMS[w].ui : "#fff";
  const sideMark = (side) => flagHtml({ id: TEAMS[side].id, kit: TEAMS[side].kit }, 22) + "<span>" + esc(TEAMS[side].short) + "</span>";
  let score = sideMark("blue") + "<span>" + game.score.blue + " - " + game.score.red + "</span>" + sideMark("red");
  if (so) {
    const pb = so.kicks.blue.reduce((a, b) => a + b, 0), pr = so.kicks.red.reduce((a, b) => a + b, 0);
    score = game.matchType === "shootout"
      ? sideMark("blue") + "<span>" + pb + " - " + pr + " (penalties)</span>" + sideMark("red")
      : score + "<span>(" + pb + "-" + pr + " on penalties)</span>";
  }
  $("winScore").innerHTML = score;
  const s = game.stats;
  $("winStats").innerHTML = game.matchType === "shootout" ? "Penalties scored: " + s.pens.scored + " \u2022 missed / saved: " + s.pens.missed :
    "Shots " + s.shots.blue + " - " + s.shots.red + " \u2022 Saves " + s.saves + " \u2022 Fouls " + s.fouls +
    " \u2022 Cards \ud83d\udfe8" + (s.yellow.blue + s.yellow.red) + " \ud83d\udfe5" + (s.red.blue + s.red.red) +
    " \u2022 Offside " + s.offside + " \u2022 Skills " + s.skills + " \u2022 Time " + formatClock(game.clock);
  const isCup = matchKind === "cup";
  $("againBtn").classList.toggle("hidden", isCup);
  $("cupContinueBtn").classList.toggle("hidden", !isCup);
  if (isCup) {
    recordCupResult();
    $("cupContinueBtn").textContent = cup.over && cup.champion === 0 ? "\ud83c\udfc6 Lift the trophy!" : "Continue cup";
  }
  showScreen("winScreen");
}
$("againBtn").addEventListener("click", () => { if (matchKind === "shootout") startShootoutMatch(); else startQuickMatch(); });
$("cupContinueBtn").addEventListener("click", () => { if (cup.over && cup.champion === 0) showTrophy(); else showCup(); });
$("menuBtn").addEventListener("click", goToMenu);
$("pauseMenuBtn").addEventListener("click", goToMenu);
$("resumeBtn").addEventListener("click", togglePause);
$("pauseBtn").addEventListener("click", togglePause);

// =====================================================================
// H. MAIN LOOP  (fixed 1/120 s logic steps, drawn every frame)
// =====================================================================
const STEP = 1 / 120;
let lastTime = performance.now(), accumulator = 0, wasWin = false;
function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;
  if (inMatch() && !paused) {
    feedInput();
    accumulator += dt;
    while (accumulator >= STEP) { sim.update(STEP); accumulator -= STEP; }
    players = sim.players;
    for (const ev of game.events.splice(0)) playEvent(ev);
  } else accumulator = 0;
  if (sim && game.phase === "win" && !wasWin && !atMenu) { wasWin = true; setTimeout(showWin, 900); }
  if (game && game.phase !== "win") wasWin = false;
  updateCamera(dt);
  draw();
  if (inMatch()) updateHud();
  requestAnimationFrame(frame);
}

loadSettings();
Sound.setMuted(settings.muted);
idleSim();
renderMenu();
resize();
requestAnimationFrame(frame);

// ---- DEBUG HOOK (for automated tests; try soccerDebug.setAutoplay(true)
//      in the browser console to watch computer vs computer) ----
window.soccerDebug = {
  start(opts = {}) {
    if (typeof opts === "string") opts = { mode: opts, difficulty: arguments[1] };
    Object.assign(settings, { mode: opts.mode || "1p", difficulty: opts.difficulty || "normal", kind: opts.kind || "quick" });
    if (opts.blue) settings.blue = opts.blue;
    if (opts.red) settings.red = opts.red;
    if (opts.rules) settings.rules = { ...settings.rules, ...opts.rules };
    startFromMenu();
    return this.state();
  },
  setAutoplay(on) { if (sim) sim.setAutoplay(on); },
  step(seconds) {
    const n = Math.round(seconds / STEP);
    for (let i = 0; i < n; i++) { if (paused || !inMatch()) break; sim.update(STEP); }
    players = sim.players;
    for (const ev of game.events.splice(0)) { /* sounds skipped */ }
    updateCamera(0, true); draw();
    return this.state();
  },
  state() {
    const pen = game.penalty, so = game.shootout, ce = game.celebration;
    return {
      phase: game.phase, mode: settings.mode, kind: matchKind, difficulty: game.difficulty,
      score: { ...game.score }, winner: game.winner, clock: Math.round(game.clock),
      setpiece: game.setpiece ? game.setpiece.type : null, indirect: !!(game.setpiece && game.setpiece.indirect),
      ball: { x: Math.round(ball.x), y: Math.round(ball.y), z: Math.round(ball.z) },
      stats: game.stats ? JSON.parse(JSON.stringify(game.stats)) : null,
      players: players.length, onPitch: { blue: players.filter((p) => p.team === "blue").length, red: players.filter((p) => p.team === "red").length },
      teams: { blue: { name: TEAMS.blue.name, short: TEAMS.blue.short, shirt: TEAMS.blue.kit.shirt }, red: { name: TEAMS.red.name, short: TEAMS.red.short, shirt: TEAMS.red.kit.shirt, away: game.teams.red.away } },
      cards: sim.roster.filter((p) => p.yellow || p.sentOff).map((p) => ({ team: p.team, num: p.num, yellow: p.yellow, sentOff: p.sentOff })),
      cardPopup: game.cardPopup ? game.cardPopup.kind : null, flag: !!game.flag,
      penalty: pen ? { team: pen.team, aimY: pen.aimY, gkChoice: pen.gkChoice } : null,
      shootout: so ? { blue: so.kicks.blue.slice(), red: so.kicks.red.slice(), sudden: so.sudden, done: so.done, winner: so.winner } : null,
      celebration: ce ? { type: ce.type, t: ce.t } : null,
      skills: sim.roster.filter((p) => p.skill).map((p) => p.skill),
      screens: SCREENS.filter((s) => !$(s).classList.contains("hidden")),
      cup: cup ? { round: cup.round, over: cup.over, champion: cup.champion, out: cup.out } : null,
      paused,
    };
  },
  forceGoal(team) { if (inMatch()) sim.forceGoal(team); },
  foul(team = "red", inBox = true, behind = false) { return sim.debugFoul(team, inBox, behind); },
  card(index, kind) { sim.giveCard(index, kind); return this.state().cards; },
  offside(team = "blue") { return sim.debugOffside(team); },
  skill(team = "blue", type = "stepover") { return sim.debugSkill(team, type); },
  press(id, action) { sim.press(id, action); },
  // Give the ball to the player a human controls (to test buttons)
  giveBall(id = "p1") {
    const c = sim.controllers.find((k) => k.id === id);
    const p = c && (c.active || sim.players.find((q) => q.team === c.team && q.role === "FWD"));
    if (!p) return false;
    game.phase = "play"; game.setpiece = null; c.active = p; p.skillCD = 0;
    Object.assign(ball, { x: p.x + p.fx * 14, y: p.y + p.fy * 14, z: 0, vx: 0, vy: 0, owner: p });
    return true;
  },
  roster() { return sim.roster.map((p, i) => ({ i, team: p.team, role: p.role, num: p.num, sentOff: p.sentOff })); },
  // Where the referee and linesmen are, for checks and screenshots.
  crew() {
    const M = 1400 / 105;
    const ref = game.officials[0], near = game.officials[1], far = game.officials[2];
    return {
      phase: game.phase,
      refM: Math.round(Math.hypot(ref.x - ball.x, ref.y - ball.y) / M * 10) / 10,
      ref: { x: Math.round(ref.x), y: Math.round(ref.y) },
      near: { x: Math.round(near.x), y: Math.round(near.y) },
      far: { x: Math.round(far.x), y: Math.round(far.y) },
      ball: { x: Math.round(ball.x), y: Math.round(ball.y) },
    };
  },
  // Cup helpers: win (or lose) your current cup match instantly
  finishMatch(winner = "blue", score = [3, 1]) {
    game.score.blue = score[0]; game.score.red = score[1];
    sim.game.phase = "win"; sim.game.winner = winner;
  },
  showWinNow() { showWin(); },
};
